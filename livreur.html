<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Livreur - Filtres</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; color: white; }
        .iphone-container { width: 100%; max-width: 414px; background: #111; height: 100vh; display: flex; flex-direction: column; padding: 50px 20px; }
        
        input { width: 100%; padding: 15px; border-radius: 15px; border: 1px solid #333; background: #222; color: #6c5ce7; font-weight: 600; margin-bottom: 20px; }
        
        .delivery-card { background: #1a1a1a; border-radius: 20px; padding: 15px; margin-bottom: 15px; border: 1px solid #333; }
        .client-tag { background: #6c5ce7; color: white; padding: 2px 10px; border-radius: 10px; font-size: 0.8rem; }
        
        .img-grid { display: flex; gap: 8px; margin: 10px 0; overflow-x: auto; padding-bottom: 5px; }
        .img-grid img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; border: 1px solid #6c5ce7; }
        
        .btn-status { width: 100%; padding: 10px; border-radius: 12px; border: none; background: #2ecc71; color: white; font-weight: 600; cursor: pointer; }
        .btn-status.livre { background: #333; color: #777; pointer-events: none; }
    </style>
</head>
<body>

<div class="iphone-container">
    <h2 style="margin-bottom:15px">Livraisons</h2>
    
    <input type="tel" id="searchPhone" placeholder="Filtrer par N° téléphone..." oninput="loadDeliveries()">

    <div id="deliveryList" style="flex:1; overflow-y:auto"></div>
</div>

<script>
    const DB_URL = "https://djami-e16ab-default-rtdb.firebaseio.com/";

    async function loadDeliveries() {
        const filter = document.getElementById('searchPhone').value;
        const res = await fetch(`${DB_URL}orders.json`);
        const orders = await res.json() || {};
        
        const list = document.getElementById('deliveryList');
        const ordersArray = Object.keys(orders).map(id => ({ ...orders[id], id }));

        list.innerHTML = ordersArray
            .filter(o => !filter || o.clientPhone.includes(filter))
            .reverse()
            .map(o => `
                <div class="delivery-card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
                        <span class="client-tag"><i class="fas fa-phone"></i> ${o.clientPhone}</span>
                        <small style="color:#666">${o.date.split(' ')[0]}</small>
                    </div>
                    <div style="font-weight:600">${o.total} F</div>
                    
                    <div class="img-grid">
                        ${o.items.map(it => `<img src="${it.img}">`).join('')}
                    </div>

                    <button class="btn-status ${o.status === 'livre' ? 'livre' : ''}" onclick="updateStatus('${o.id}')">
                        ${o.status === 'livre' ? 'DÉJÀ LIVRÉ' : 'MARQUER LIVRÉ'}
                    </button>
                </div>
            `).join('');
    }

    async function updateStatus(id) {
        if(confirm("Confirmer la livraison ?")) {
            await fetch(`${DB_URL}orders/${id}/status.json`, { method: 'PUT', body: JSON.stringify("livre") });
            loadDeliveries();
        }
    }

    window.onload = loadDeliveries;
    setInterval(loadDeliveries, 15000); // Actualisation automatique
</script>
</body>
</html>
