<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Livreur - Glamour Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; color: white; }
        .iphone-container { width: 100%; max-width: 414px; background: #111; height: 100vh; display: flex; flex-direction: column; padding: 50px 20px; }
        
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .header img { width: 50px; }

        #searchBox { width: 100%; padding: 15px; border-radius: 15px; border: 1px solid #333; background: #222; color: #d4a373; font-weight: 600; margin-bottom: 20px; outline: none; }
        
        .order-card { background: #1a1a1a; border-radius: 20px; padding: 15px; margin-bottom: 15px; border: 1px solid #222; }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .phone-tag { background: #d4a373; color: black; padding: 3px 10px; border-radius: 10px; font-size: 0.8rem; font-weight: bold; }
        
        .item-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; }
        .item-scroll img { width: 55px; height: 55px; border-radius: 10px; border: 1px solid #d4a373; object-fit: cover; }
        
        .actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-status { background: #2ecc71; color: white; }
        .btn-delete { background: #e63946; color: white; flex: 0 0 50px; }
        .is-done { opacity: 0.4; }
    </style>
</head>
<body>

<div class="iphone-container">
    <div class="header">
        <img src="logo.png" onerror="this.src='https://via.placeholder.com/50?text=GM'">
        <div>
            <h2 style="font-size:1.1rem; line-height:1;">GLAMOUR MARKET</h2>
            <small style="color:#d4a373">Gestion Livraisons</small>
        </div>
    </div>
    
    <input type="tel" id="searchBox" placeholder="Rechercher un téléphone..." oninput="renderDeliveries()">

    <div id="deliveryList" style="flex:1; overflow-y:auto; scrollbar-width:none;"></div>
</div>

<script>
    const DB_URL = "https://djami-e16ab-default-rtdb.firebaseio.com/";
    let allOrders = {};

    async function loadData() {
        const res = await fetch(`${DB_URL}orders.json`);
        allOrders = await res.json() || {};
        renderDeliveries();
    }

    function renderDeliveries() {
        const filter = document.getElementById('searchBox').value;
        const list = document.getElementById('deliveryList');
        
        const filteredIds = Object.keys(allOrders).reverse().filter(id => 
            !filter || allOrders[id].phone.includes(filter)
        );

        list.innerHTML = filteredIds.map(id => {
            const o = allOrders[id];
            const isLivre = o.status === 'livre';
            return `
                <div class="order-card ${isLivre ? 'is-done' : ''}">
                    <div class="card-top">
                        <div>
                            <span class="phone-tag"><i class="fas fa-phone"></i> ${o.phone}</span>
                            <div style="font-size:0.6rem; color:#666; mt-5">${o.date}</div>
                        </div>
                        <div style="font-weight:bold; color:#d4a373">${o.total} F</div>
                    </div>

                    <div class="item-scroll">
                        ${o.items.map(it => `<img src="${it.img}" title="${it.name}">`).join('')}
                    </div>

                    <div class="actions">
                        <button class="btn btn-status" onclick="updateStatus('${id}')" ${isLivre ? 'disabled' : ''}>
                            ${isLivre ? '<i class="fas fa-check"></i> LIVRÉ' : '<i class="fas fa-truck"></i> LIVRER'}
                        </button>
                        <button class="btn btn-delete" onclick="deleteOrder('${id}')">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    async function updateStatus(id) {
        if(confirm("Confirmer la livraison ?")) {
            await fetch(`${DB_URL}orders/${id}/status.json`, { method: 'PUT', body: JSON.stringify("livre") });
            loadData();
        }
    }

    async function deleteOrder(id) {
        if(confirm("Supprimer définitivement cette commande de l'historique ?")) {
            await fetch(`${DB_URL}orders/${id}.json`, { method: 'DELETE' });
            loadData();
        }
    }

    window.onload = loadData;
    setInterval(loadData, 10000); // Rafraîchissement auto
</script>
</body>
</html>
