<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Glamour Market">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="manifest" href="manifest.json">

    <title>Glamour Market - Client</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: #1a1a1a; 
            font-family: 'Poppins', sans-serif; 
            display: flex; 
            justify-content: center; 
            overflow: hidden; 
            color: white; 
            height: 100vh;
            width: 100vw;
            position: fixed; /* Bloque le défilement élastique du navigateur */
        }

        .iphone-container { 
            width: 100%; 
            max-width: 414px; 
            background: #000; 
            height: 100vh; 
            position: relative; 
            display: flex; 
            flex-direction: column; 
        }
        
        /* Auth Screen */
        #auth-screen { 
            position: absolute; 
            inset: 0; 
            background: linear-gradient(180deg, #111 0%, #000 100%); 
            z-index: 500; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 30px; 
        }
        .logo-img { width: 120px; margin-bottom: 20px; filter: drop-shadow(0 0 10px rgba(212, 163, 115, 0.3)); }
        
        input { 
            width: 100%; 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 12px; 
            border: 1px solid #333; 
            background: #222; 
            color: white; 
            font-size: 1rem; 
            outline: none;
        }

        .btn-main { 
            width: 100%; 
            padding: 15px; 
            border-radius: 12px; 
            border: none; 
            background: #d4a373; 
            color: white; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 10px; 
            transition: 0.3s; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .btn-main:active { transform: scale(0.98); opacity: 0.8; }
        
        /* Nav */
        .top-nav { 
            padding: 55px 20px 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(0,0,0,0.9); 
            border-bottom: 1px solid #222; 
            z-index: 100;
        }
        
        /* Products */
        .product-list { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .product-list::-webkit-scrollbar { display: none; }

        .product-card { 
            background: #1a1a1a; 
            border-radius: 20px; 
            margin-bottom: 12px; 
            padding: 12px; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            border: 1px solid #222; 
        }
        .product-card img { width: 70px; height: 70px; border-radius: 12px; object-fit: cover; background: #222; }
        
        /* Overlays */
        .overlay { 
            position: absolute; 
            inset: 0; 
            background: #000; 
            z-index: 200; 
            transform: translateY(100%); 
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
            padding: 70px 20px 20px; 
            overflow-y: auto; 
        }
        .overlay.active { transform: translateY(0); }
        .close-btn { position: absolute; top: 25px; right: 20px; font-size: 1.5rem; color: #d4a373; z-index: 210; }

        .order-card { 
            background: #111; 
            padding: 15px; 
            border-radius: 15px; 
            margin-bottom: 15px; 
            border-left: 4px solid #d4a373; 
        }
        .img-row { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
        .img-row img { width: 45px; height: 45px; border-radius: 8px; border: 1px solid #333; flex-shrink: 0; }
        .status-badge { float: right; font-size: 0.65rem; padding: 4px 10px; border-radius: 12px; background: #d4a373; color: black; font-weight: bold; }
        
        /* Empty State */
        .empty-msg { text-align: center; color: #444; margin-top: 50px; }
    </style>
</head>
<body>

<div class="iphone-container">
    <div id="auth-screen">
        <img src="logo.png" class="logo-img" onerror="this.src='https://via.placeholder.com/120?text=Glamour+Market'">
        <h2 style="color:#d4a373; margin-bottom:5px; letter-spacing: 2px;">GLAMOUR MARKET</h2>
        <p style="font-size:0.8rem; color:#666; margin-bottom:25px; text-transform: uppercase;">Espace Client</p>
        <input type="tel" id="userPhone" placeholder="Numéro de téléphone">
        <input type="password" id="userPass" placeholder="Mot de passe">
        <button class="btn-main" onclick="handleAuth()">SE CONNECTER / S'INSCRIRE</button>
    </div>

    <div class="top-nav">
        <div>
            <img src="logo2.png" style="height:30px;" onerror="this.style.display='none'">
            <div id="userNameDisplay" style="color:#d4a373; font-size: 0.75rem; font-weight: 600;"></div>
        </div>
        <div style="display:flex; gap:20px">
            <i class="fas fa-history" onclick="toggleOverlay('history-overlay')" style="font-size:1.4rem;"></i>
            <div style="position:relative" onclick="toggleOverlay('cart-overlay')">
                <i class="fas fa-shopping-bag" style="font-size:1.4rem;"></i>
                <span id="cart-count" style="position:absolute; top:-5px; right:-8px; background:#e63946; font-size:0.65rem; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center; font-weight:bold;">0</span>
            </div>
            <i class="fas fa-sign-out-alt" onclick="location.reload()" style="color:#e63946; font-size:1.4rem;"></i>
        </div>
    </div>

    <div class="product-list" id="productList"></div>

    <div id="cart-overlay" class="overlay">
        <i class="fas fa-chevron-down close-btn" onclick="toggleOverlay('cart-overlay')"></i>
        <h3 style="margin-bottom:20px; border-bottom:1px solid #222; padding-bottom:10px;">Mon Panier</h3>
        <div id="cartContent"></div>
        <div id="totalCart" style="margin-top:20px; font-weight:bold; text-align:right; font-size:1.2rem; color:#d4a373;">Total: 0 F</div>
        <button class="btn-main" id="confirmBtn" onclick="confirmOrder()" style="margin-top:25px">
            <i class="fas fa-check"></i> CONFIRMER LA COMMANDE
        </button>
    </div>

    <div id="history-overlay" class="overlay">
        <i class="fas fa-chevron-down close-btn" onclick="toggleOverlay('history-overlay')"></i>
        <h3 style="margin-bottom:20px; border-bottom:1px solid #222; padding-bottom:10px;">Mes Commandes</h3>
        <div id="historyContent"></div>
    </div>
</div>

<script>
    const DB_URL = "https://djami-e16ab-default-rtdb.firebaseio.com/";
    let currentPhone = "", cart = [];

    async function handleAuth() {
        const phone = document.getElementById('userPhone').value.trim();
        const pass = document.getElementById('userPass').value.trim();
        if(!phone || !pass) return alert("Veuillez remplir tous les champs");

        try {
            const res = await fetch(`${DB_URL}clients/${phone}.json`);
            const client = await res.json();

            if(!client) {
                if(confirm("Aucun compte trouvé. Créer un compte avec ce numéro ?")) {
                    await fetch(`${DB_URL}clients/${phone}.json`, { method: 'PUT', body: JSON.stringify({ pass }) });
                    startApp(phone);
                }
            } else if(client.pass === pass) { 
                startApp(phone); 
            } else { 
                alert("Mot de passe incorrect"); 
            }
        } catch (e) { alert("Erreur de connexion"); }
    }

    function startApp(phone) {
        currentPhone = phone;
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('userNameDisplay').innerText = "N°: " + phone;
        loadProducts();
        loadHistory();
    }

    async function loadProducts() {
        const res = await fetch(`${DB_URL}products.json`);
        const prods = await res.json() || {};
        document.getElementById('productList').innerHTML = Object.keys(prods).map(id => `
            <div class="product-card">
                <img src="${prods[id].img}" onerror="this.src='https://via.placeholder.com/70?text=Glamour'">
                <div style="flex:1">
                    <div style="font-weight:600; font-size:0.95rem">${prods[id].name}</div>
                    <div style="color:#d4a373; font-weight:bold;">${prods[id].price} F</div>
                    <button class="btn-main" style="width:auto; padding:6px 15px; font-size:0.75rem; margin-top:5px;" 
                            onclick="addToCart('${id}','${prods[id].name.replace(/'/g, "\\'")}','${prods[id].price}','${prods[id].img}')">
                        <i class="fas fa-plus"></i> Ajouter
                    </button>
                </div>
            </div>`).join('');
    }

    function addToCart(id, name, price, img) {
        cart.push({id, name, price, img});
        document.getElementById('cart-count').innerText = cart.length;
        updateCartUI();
        // Feedback tactile
        if(window.navigator.vibrate) window.navigator.vibrate(50);
    }

    function updateCartUI() {
        let total = 0;
        const container = document.getElementById('cartContent');
        if(cart.length === 0) {
            container.innerHTML = '<div class="empty-msg">Votre panier est vide</div>';
            document.getElementById('totalCart').innerText = "Total: 0 F";
            return;
        }
        container.innerHTML = cart.map((it, i) => {
            total += parseInt(it.price);
            return `
            <div class="product-card" style="padding:8px; margin-bottom:8px; background:#111;">
                <img src="${it.img}" style="width:45px; height:45px">
                <div style="flex:1; font-size:0.85rem">${it.name}</div>
                <i class="fas fa-trash-alt" onclick="removeFromCart(${i})" style="color:#e63946; padding:10px;"></i>
            </div>`;
        }).join('');
        document.getElementById('totalCart').innerText = `Total: ${total} F`;
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        document.getElementById('cart-count').innerText = cart.length;
        updateCartUI();
    }

    async function confirmOrder() {
        if(cart.length === 0) return;
        const btn = document.getElementById('confirmBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Envoi...';

        const order = { 
            phone: currentPhone, 
            date: new Date().toLocaleString('fr-FR'), 
            items: cart, 
            status: "en_cours", 
            total: cart.reduce((s,i) => s + parseInt(i.price), 0) 
        };

        try {
            await fetch(`${DB_URL}orders.json`, { method: 'POST', body: JSON.stringify(order) });
            cart = [];
            updateCartUI();
            document.getElementById('cart-count').innerText = 0;
            toggleOverlay('cart-overlay');
            alert("✅ Commande envoyée avec succès !");
            loadHistory();
        } catch (e) {
            alert("Erreur lors de l'envoi");
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check"></i> CONFIRMER LA COMMANDE';
        }
    }

    async function loadHistory() {
        const res = await fetch(`${DB_URL}orders.json`);
        const orders = await res.json() || {};
        const myOrders = Object.values(orders).filter(o => o.phone === currentPhone).reverse();
        
        const container = document.getElementById('historyContent');
        if(myOrders.length === 0) {
            container.innerHTML = '<div class="empty-msg">Aucune commande passée</div>';
            return;
        }

        container.innerHTML = myOrders.map(o => `
            <div class="order-card">
                <span class="status-badge" style="background:${o.status === 'livre' ? '#2ecc71' : '#d4a373'}">
                    ${o.status === 'livre' ? 'LIVRÉ' : 'EN COURS'}
                </span>
                <div style="font-size:0.7rem; color:#888;"><i class="far fa-calendar-alt"></i> ${o.date}</div>
                <div style="font-weight:600; margin: 5px 0;">${o.total} F</div>
                <div class="img-row">${o.items.map(it => `<img src="${it.img}">`).join('')}</div>
            </div>`).join('');
    }

    function toggleOverlay(id) { 
        document.getElementById(id).classList.toggle('active'); 
    }
</script>
</body>
</html>
