<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Boutique Client</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; overflow: hidden; color: white; }
        .iphone-container { width: 100%; max-width: 414px; background: #000; height: 100vh; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Navigation Haute */
        .top-nav { padding: 50px 20px 10px; display: flex; justify-content: space-between; align-items: center; z-index: 100; background: rgba(0,0,0,0.8); }
        .btn-cart { background: #6c5ce7; border: none; color: white; padding: 10px; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; position: relative; }
        #cart-count { position: absolute; top: -5px; right: -5px; background: red; font-size: 0.7rem; border-radius: 50%; padding: 2px 6px; }

        /* Galerie de Produits (Swipe Vertical) */
        .product-list { flex: 1; overflow-y: auto; padding: 10px; scrollbar-width: none; }
        .product-card { background: #222; border-radius: 20px; margin-bottom: 15px; padding: 15px; display: flex; align-items: center; gap: 15px; border: 1px solid #333; }
        .product-card img { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; }
        .product-info { flex: 1; }
        .btn-add { background: #6c5ce7; border: none; color: white; padding: 8px 15px; border-radius: 15px; font-size: 0.8rem; cursor: pointer; margin-top: 5px; }

        /* Panier & Commandes (Overlay) */
        .overlay { position: absolute; inset: 0; background: #111; z-index: 200; transform: translateY(100%); transition: 0.4s ease; padding: 60px 20px; overflow-y: auto; }
        .overlay.active { transform: translateY(0); }
        .close-overlay { position: absolute; top: 20px; right: 20px; color: white; font-size: 1.5rem; cursor: pointer; }
        
        .order-item { background: #222; padding: 10px; border-radius: 15px; margin-bottom: 10px; }
        .order-products-imgs { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
        .order-products-imgs img { width: 40px; height: 40px; border-radius: 5px; border: 1px solid #444; }
        
        .status { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; float: right; }
        .status-en_cours { background: orange; }
        .status-livre { background: green; }
    </style>
</head>
<body>

<div class="iphone-container">
    <div class="top-nav">
        <h2>Produits</h2>
        <div>
            <button class="btn-cart" onclick="toggleOverlay('orders-overlay')"><i class="fas fa-box"></i></button>
            <button class="btn-cart" onclick="toggleOverlay('cart-overlay')">
                <i class="fas fa-shopping-basket"></i>
                <span id="cart-count">0</span>
            </button>
        </div>
    </div>

    <div class="product-list" id="productList"></div>

    <div id="cart-overlay" class="overlay">
        <span class="close-overlay" onclick="toggleOverlay('cart-overlay')">✖</span>
        <h3>Votre Panier</h3>
        <div id="cartContent" style="margin-top:20px;"></div>
        <button class="btn-add" style="width:100%; margin-top:20px; padding:15px;" onclick="placeOrder()">COMMANDER MAINTENANT</button>
    </div>

    <div id="orders-overlay" class="overlay">
        <span class="close-overlay" onclick="toggleOverlay('orders-overlay')">✖</span>
        <h3>Mes Commandes</h3>
        <div id="myOrdersContent" style="margin-top:20px;"></div>
    </div>
</div>

<script>
    const DB_URL = "https://djami-e16ab-default-rtdb.firebaseio.com/";
    let cart = [];

    async function loadData() {
        const res = await fetch(`${DB_URL}products.json`);
        const products = await res.json() || {};
        const list = document.getElementById('productList');
        list.innerHTML = Object.keys(products).map(id => `
            <div class="product-card">
                <img src="${products[id].img}" alt="">
                <div class="product-info">
                    <div style="font-weight:600">${products[id].name}</div>
                    <div style="color:#6c5ce7">${products[id].price} F</div>
                    <button class="btn-add" onclick="addToCart('${id}', '${products[id].name}', '${products[id].price}', '${products[id].img}')">Ajouter</button>
                </div>
            </div>
        `).join('');
        loadOrders();
    }

    function addToCart(id, name, price, img) {
        cart.push({id, name, price, img});
        document.getElementById('cart-count').innerText = cart.length;
        updateCartUI();
    }

    function updateCartUI() {
        const cont = document.getElementById('cartContent');
        cont.innerHTML = cart.map((item, i) => `
            <div class="product-card" style="margin-bottom:10px">
                <img src="${item.img}" style="width:50px; height:50px">
                <div class="product-info">
                    <div>${item.name}</div>
                    <div style="font-size:0.8rem">${item.price} F</div>
                </div>
                <i class="fas fa-trash" onclick="cart.splice(${i},1); updateCartUI();" style="color:red"></i>
            </div>
        `).join('');
    }

    async function placeOrder() {
        if(cart.length === 0) return;
        const order = {
            date: new Date().toLocaleString(),
            items: cart,
            status: "en_cours",
            total: cart.reduce((sum, item) => sum + parseInt(item.price), 0)
        };
        await fetch(`${DB_URL}orders.json`, { method: 'POST', body: JSON.stringify(order) });
        cart = []; document.getElementById('cart-count').innerText = 0;
        toggleOverlay('cart-overlay');
        alert("Commande envoyée !");
        loadOrders();
    }

    async function loadOrders() {
        const res = await fetch(`${DB_URL}orders.json`);
        const orders = await res.json() || {};
        document.getElementById('myOrdersContent').innerHTML = Object.keys(orders).reverse().map(id => `
            <div class="order-item">
                <span class="status status-${orders[id].status}">${orders[id].status}</span>
                <div style="font-size:0.8rem; color:#aaa">${orders[id].date}</div>
                <div style="font-weight:600">Total: ${orders[id].total} F</div>
                <div class="order-products-imgs">
                    ${orders[id].items.map(it => `<img src="${it.img}">`).join('')}
                </div>
            </div>
        `).join('');
    }

    function toggleOverlay(id) { document.getElementById(id).classList.toggle('active'); }
    
    window.onload = loadData;
</script>
</body>
</html>
