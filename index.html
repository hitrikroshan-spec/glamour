<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOUTIQUE - STYL COSMETIC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --sidebar-bg: #0f172a; --sidebar-active: #2563eb; --main-bg: #f8fafc; --success: #22c55e; --danger: #ef4444; --border: #e2e8f0; --accent: #38bdf8; }
        body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; height: 100vh; background: var(--main-bg); overflow: hidden; color: #1e293b; }
        #barcode-catcher { position: absolute; opacity: 0; pointer-events: none; }
        #loginOverlay { position: fixed; inset: 0; background: var(--sidebar-bg); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 40px; border-radius: 24px; width: 320px; text-align: center; }
        .login-card input { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 12px; box-sizing: border-box;}
        .sidebar { width: 260px; background: var(--sidebar-bg); color: white; display: flex; flex-direction: column; }
        .sidebar-header { padding: 25px; border-bottom: 1px solid #1e293b; }
        .user-badge { background: rgba(34, 197, 94, 0.1); color: #4ade80; padding: 10px; border-radius: 12px; font-size: 0.9em; margin-top: 15px; text-align: center;}
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .search-bar { padding: 20px; background: white; border-bottom: 1px solid var(--border); }
        .search-bar input { width: 100%; padding: 15px; border-radius: 14px; border: 1px solid var(--border); background: #f8fafc; }
        .products-container { flex: 1; padding: 25px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .p-card { background: white; border-radius: 18px; padding: 15px; border: 1px solid var(--border); text-align: center; cursor: pointer; position: relative; }
        .p-img { height: 100px; margin-bottom: 10px; }
        .p-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .p-name { font-weight: 700; font-size: 0.85em; margin-bottom: 5px; }
        .p-price { color: var(--sidebar-active); font-weight: 800; }
        .stock-tag { font-size: 0.7em; padding: 4px; border-radius: 6px; position: absolute; top: 5px; right: 5px; color: white; }
        .cart-panel { width: 340px; background: white; border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .cart-list { flex: 1; overflow-y: auto; padding: 15px; }
        .cart-item { display: flex; align-items: center; gap: 10px; padding: 10px; background: #f8fafc; border-radius: 12px; margin-bottom: 10px; }
        .cart-item img { width: 40px; height: 40px; object-fit: cover; border-radius: 5px; }
        .total-row { padding: 25px; border-top: 1px solid var(--border); font-size: 1.4em; font-weight: 900; display: flex; justify-content: space-between; }
        .btn-checkout { width: 100%; padding: 20px; background: var(--sidebar-active); color: white; border: none; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>

    <input type="text" id="barcode-catcher" autofocus>

    <div id="loginOverlay">
        <div class="login-card">
            <h2>STYL COSMETIC</h2>
            <input type="text" id="uNameInput" placeholder="Vendeuse">
            <input type="password" id="uPassInput" placeholder="Code">
            <button onclick="attemptLogin()" style="width:100%; padding:15px; background:var(--sidebar-active); color:white; border:none; border-radius:12px; cursor:pointer;">OUVRIR SESSION</button>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">
            <div style="font-weight:900;">BOUTIQUE</div>
            <div id="userDisplay" class="user-badge">-</div>
        </div>
        <div style="flex:1; padding:20px; font-size:0.8em; color:#64748b;">
            Dernières ventes aujourd'hui :
            <div id="sellerHistory"></div>
        </div>
    </div>

    <div class="main-content">
        <div class="search-bar"><input type="text" id="searchInput" placeholder="Rechercher un produit..." oninput="filterProducts()"></div>
        <div class="products-container" id="productGrid"></div>
    </div>

    <div class="cart-panel">
        <div style="padding:20px; font-weight:800; border-bottom:1px solid var(--border);">PANIER</div>
        <div class="cart-list" id="cartList"></div>
        <div class="total-row"><span>TOTAL</span><span id="totalPrice">0 F</span></div>
        <button class="btn-checkout" onclick="checkout()">VALIDER LA VENTE</button>
    </div>

    <script>
        const DB_URL = "https://djami-e16ab-default-rtdb.firebaseio.com/";
        let products = [], cart = [], currentUser = "";

        async function fbGet(path) {
            const res = await fetch(`${DB_URL}${path}.json`);
            return await res.json();
        }

        async function attemptLogin() {
            const usersData = await fbGet('users') || {};
            const name = document.getElementById('uNameInput').value;
            const pass = document.getElementById('uPassInput').value;
            const user = Object.values(usersData).find(u => u.name === name && u.pass === pass);
            if(user) {
                currentUser = name;
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('userDisplay').innerText = currentUser;
                loadData();
            } else { alert("Accès refusé"); }
        }

        async function loadData() {
            const data = await fbGet('products') || {};
            products = Object.keys(data).map(id => ({...data[id], id}));
            renderProducts(products);
        }

        function renderProducts(list) {
            document.getElementById('productGrid').innerHTML = list.map(p => `
                <div class="p-card" onclick="addToCart('${p.id}')">
                    <div class="stock-tag" style="background:${p.stock > 0 ? '#22c55e' : '#ef4444'}">${p.stock}</div>
                    <div class="p-img"><img src="${p.img}"></div>
                    <div class="p-name">${p.name}</div>
                    <div class="p-price">${parseInt(p.price).toLocaleString()} F</div>
                </div>`).join('');
        }

        function filterProducts() {
            const val = document.getElementById('searchInput').value.toLowerCase();
            renderProducts(products.filter(p => p.name.toLowerCase().includes(val) || p.barcode.includes(val)));
        }

        function addToCart(id) {
            const p = products.find(prod => prod.id === id);
            if(!p || p.stock <= 0) return;
            const exist = cart.find(item => item.id === id);
            if(exist) { if(exist.qty < p.stock) exist.qty++; } else { cart.push({...p, qty:1}); }
            updateCart();
        }

        function updateCart() {
            let total = 0;
            document.getElementById('cartList').innerHTML = cart.map((item, i) => {
                total += item.price * item.qty;
                return `<div class="cart-item">
                    <img src="${item.img}">
                    <div style="flex:1"><b>${item.name}</b><br>${item.qty} x ${item.price} F</div>
                    <i class="fas fa-trash" style="color:var(--danger); cursor:pointer" onclick="cart.splice(${i},1);updateCart()"></i>
                </div>`;
            }).join('');
            document.getElementById('totalPrice').innerText = total.toLocaleString() + " F";
        }

        async function checkout() {
            if(cart.length === 0) return;
            const now = new Date();
            
            for(let item of cart) {
                const newStock = item.stock - item.qty;
                await fetch(`${DB_URL}products/${item.id}/stock.json`, { method: 'PUT', body: newStock });
            }

            await fetch(`${DB_URL}salesHistory.json`, { method: 'POST', body: JSON.stringify({
                user: currentUser,
                date: now.toLocaleDateString('fr-FR'),
                time: now.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}),
                total: cart.reduce((s,i) => s + (i.price * i.qty), 0),
                items: cart
            })});

            cart = []; updateCart(); loadData(); alert("Vente enregistrée !");
        }

        document.getElementById('barcode-catcher').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') {
                const p = products.find(prod => prod.barcode === e.target.value);
                if(p) addToCart(p.id);
                e.target.value = '';
            }
        });
    </script>
</body>
</html>
